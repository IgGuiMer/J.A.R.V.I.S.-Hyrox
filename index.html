.bar{height:6px;background:var(--line);border-radius:3px;overflow:hidden;margin-top:4px}
.bar u{display:block;height:100%;background:var(--fill);transition:width .25s}
.blk{margin:12px 0;padding:12px 14px;background:var(--card);border:1px solid var(--line);border-radius:6px}
.bh{display:flex;gap:10px;align-items:center;cursor:pointer}

.bt{margin:6px 0 0 30px;white-space:pre-line;font-size:16px}

.note{background:var(--card);border:1px solid var(--line);border-left:3px solid var(--acc);padding:10px 12px;font-size:15px;margin:12px 0;border-radius:0 6px 6px 0}

.mh b{font:700 20px "Barlow Condensed",sans-serif;flex:1}
.mh input:checked~b,.mh input:checked~.kc{color:var(--mute)}
.kc{font-weight:600}
.mp{display:flex;gap:16px;font-size:14px;color:var(--mute);margin:2px 0 0 30px}
.meal p{margin:4px 0 0 30px;font-size:15px}
.it{display:flex;gap:10px;padding:6px 0;cursor:pointer}
.it input{margin-top:2px}

.tw{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:15px}
th,td{text-align:left;padding:7px 8px 7px 0;border-bottom:1px solid var(--line);vertical-align:top}
th{font-weight:600;color:var(--mute)}
ul{padding-left:20px;margin:6px 0}
.rst{margin-top:28px;background:none;border:1px solid var(--line);color:var(--mute);padding:8px 14px;border-radius:6px;font:inherit;font-size:14px;cursor:pointer}
</style>

d[3].forEach((b,i)=>{h+=`<div class="blk"><label class="bh"><input type="checkbox" data-k="${id}b${i}"${S[id+'b'+i]?' checked':''}><b>${b[0]}</b></label><div class="bt">${b[1]}</div></div>`});

h+=ms.map((r,i)=>`<div class="meal"><label class="mh"><input type="checkbox" data-k="${id}m${i}"${S[id+'m'+i]?' checked':''}><b>${r[0]}</b><span class="kc">${r[1]} kcal</span></label><div class="mp"><span>P ${r[2]} g</span><span>C ${r[3]} g</span><span>G ${r[4]} g</span></div><p>${r[5]}</p></div>`).join('');
return h+'<button class="rst" id="rst">Reiniciar marcas</button>';
}
function upd(id){
const ms=meals(id),A=[0,0,0,0],T=[0,0,0,0];
ms.forEach((r,i)=>{for(let k=0;k<4;k++){T[k]+=r[k+1];if(S[id+'m'+i])A[k]+=r[k+1]}});
const L=['Energía','Proteína','Carbos','Grasa'],U=[' kcal',' g',' g',' g'];
$('#mac').innerHTML=L.map((l,k)=>`<div><div class="ml"><span>${l}</span><b>${A[k]}<i> / ${T[k]}${U[k]}</i></b></div><div class="bar"><u style="width:${Math.min(100,A[k]/T[k]*100)}%"></u></div></div>`).join('');
}
const tb=(h,r)=>`<div class="tw"><table><thead><tr>${h.map(x=>`<th>${x}</th>`).join('')}</tr></thead><tbody>${r.map(a=>`<tr>${a.map(x=>`<td>${x}</td>`).join('')}</tr>`).join('')}</tbody></table></div>`;
function ref(){
const fb=['Peso: media de la semana, al levantarte','Resultados clave: compromised running del miércoles (vs 34:26), series del martes, sim del sábado','Sensaciones 1–10 (fatiga, piernas, hambre), horas reales de sueño y noches interrumpidas','Garmin: HRV, FC reposo y readiness','Adherencia: % de comidas cumplidas y comodines usados','Sóleo: cualquier molestia, aunque sea mínima','Eventos sociales de la semana que viene'];
return `<h2>Referencias</h2><h3>Tus ritmos (calculadora)</h3>`+tb(['Zona','Carrera, min/km (lpm)','Remo, min/500','SkiErg, min/500'],[['R1 suave','5:53-5:08 (113-142)','2:13-2:06','2:21-2:14'],['R2 aeróbico','4:46-4:27 (144-159)','2:03-1:58','2:11-2:06'],['<b>RP</b>','<b>4:27</b>','<b>2:00</b>','<b>2:08</b>'],['R3 umbral','4:21-4:10 (161-170)','1:56-1:53','2:04-2:01'],['R4 VO2max','4:00-3:49 (172-181)','1:51-1:48','1:59-1:56'],['R5 máximo','< 3:42 (> 181)','< 1:46','< 1:54']])+`<p class="note">1.000 m a RP: remo 3:59 y SkiErg 4:17. Pulso aproximado en ergómetros: R1 105-134, R2 136-151, R3 153-162, R4 164-173. @PO es el peso oficial y tú cargas PRO. R2 cómodo es la mitad baja del rango (hasta ~4:36/km y 152 lpm).</p>`+
`<h3>Semana tipo</h3>`+tb(['Día','Sesión','Nutrición'],[['Lun','Fuerza upper + Hyrox strength + easy aerobic','Media'],['Mar','Series de carrera','Alta'],['Mié','Fuerza lower + compromised running','Alta'],['Jue','Descanso activo aeróbico','Baja'],['Vie','Fuerza A y B + easy aerobic','Media'],['Sáb','Skills + simulación Hyrox','Alta'],['Dom','Long run','Alta']])+
`<h3>Volumen de la semana</h3>`+tb(['Qué','Valor'],[['Carrera total, sin el jueves','≈ 43 km'],['De calidad (R3, R5 y RP)','≈ 15 km'],['Series de fuerza pesadas','22'],['Rondas de trabajo Hyrox','18 (6 lunes + 8 miércoles + 4 viernes) + simulación completa el sábado'],['Ergómetros','30′ a umbral (lunes) + 30′ fácil (viernes)']])+`<h3>Tipos de día</h3>`+tb(['Día','kcal','P','C','G'],[['<span class="Alta">Alta</span>','3.050','180','414','75'],['<span class="Media">Media</span>','2.800','180','351','75'],['<span class="Baja">Baja</span>','2.550','180','277','80']])+
`<p class="note">Media semanal ≈ 2.900 kcal. La semana 2 mantiene este volumen con estímulos distintos y se decide con tu feedback del domingo. La ajusto cada domingo con tu peso medio: objetivo −0,25 a −0,4 kg por semana.</p>
<h3>Semáforo, a las 5:30</h3>`+tb(['Estado','Condición','Acción'],[['<span class="Baja">Verde</span>','HRV ≥ 57, sueño ≥ 6 h 30, sin dolor','Sesión tal cual'],['<span class="Media">Ámbar</span>','HRV 50–56 o sueño 5 h 30–6 h 30','−20-30 % de volumen, RPE 7 como techo'],['<span class="Alta">Rojo</span>','HRV &lt; 50, sueño &lt; 5 h 30 o sóleo ≥ 3/10','R1 30-40 min + movilidad']])+
`<h3>Reglas</h3><ul><li>Proteína 180 g, grasa nunca por debajo de 70 g, fibra 30-40 g.</li><li>80/20: cada día lleva un postre de ~250 kcal (Magnum negro, galletas o chocolate) ya encajado en los macros.</li><li>Hambre a media mañana: pasa el yogur y la fruta del desayuno a las 11:00. Mismos macros, mejor reparto.</li><li>Si entrenas de noche (21:30): cena a las 19:00, 1 plátano a las 20:45 y un batido de 30 g de whey con 30 g de carbos al terminar; ese día quitas el postre.</li><li>Hamburguesa en pan brioche, pizza de fajita, carbonara y boloñesa ya están repartidas por los días. Si cambias un día de sitio, respeta el tipo (alta, media o baja).</li><li>Pésate cada mañana; decido con la media semanal.</li></ul>
<h3>Hoja de ruta</h3>`+tb(['Fase','Fechas','Foco'],[['1. Base y definición','16 nov-10 ene','Déficit leve, ~81 kg'],['2. Desarrollo','11 ene-28 feb','Mantenimiento, ~80,5 kg'],['3. Específica','1 mar-4 abr','Sims completas'],['4. Competición','5-17 abr','Taper, H9 el 10, Málaga el 17']])+
`<h3>Feedback del domingo</h3>`+fb.map((x,i)=>chk('fb'+i,x)).join('')+`<h3>Conexión con el agente</h3><p class="note">${LIVE?'Conectado: este plan viene del agente.':'Sin conectar: se muestra el plan guardado en la app.'}</p><button class="rst" id="key">Introducir clave del agente</button><br><button class="rst" id="rst">Reiniciar marcas</button>`;
}
function buildNav(){$('#n').innerHTML=IDS.map((id,i)=>`${i>0&&DN[id][1]==='Lun'?'<span class="gap"></span>':''}<button class="${W[id][2]}" data-i="d${id}"><b>${DN[id][0]}</b>${DN[id][1]}</button>`).join('')+'<button class="rf" data-i="ref">Ref</button>'}
buildNav();
const todayISO=()=>new Date().toLocaleDateString('sv-SE',{timeZone:'Europe/Madrid'});
const defId=()=>{const t='f'+todayISO().replace(/-/g,'');return W[t]?t:IDS[0]};
const NAMES=['Dom','Lun','Mar','Mié','Jue','Vie','Sáb'];
let LIVE=false;
async function loadPlan(){
try{
const q=new URLSearchParams(location.search);let k=q.get('k');
if(k){try{localStorage.setItem('hxk',k)}catch(e){}history.replaceState(null,'',location.pathname+location.hash)}
try{k=k||localStorage.getItem('hxk')}catch(e){}
if(!k)return false;
const r=await fetch('/api/plan?k='+encodeURIComponent(k),{cache:'no-store'});
if(!r.ok)return false;
const j=await r.json();
const ds=(j.dias||[]).filter(d=>d&&d.fecha&&d.titulo&&Array.isArray(d.bloques)&&d.menu);
if(!ds.length)return false;
const nW={},nM={},nD={};
ds.forEach(d=>{
const id='f'+d.fecha.replace(/-/g,'');
nW[id]=[d.titulo,d.subtitulo||'',d.tipo,d.bloques.map(b=>[b.titulo,b.texto]),d.nota||''];
nM[id]=[d.menu.comida,d.menu.cena,d.menu.postre];
const dt=new Date(d.fecha+'T12:00:00');
nD[id]=[String(dt.getDate()),NAMES[dt.getDay()]];
});
W=nW;MENU=nM;DN=nD;IDS=Object.keys(W);LIVE=true;
const s=document.getElementById('sub');if(s)s.textContent='Plan del agente, actualizado '+new Date(j.actualizado||Date.now()).toLocaleDateString('es-ES',{day:'numeric',month:'long'})+'. Hyrox Open, 17 de abril.';
return true;
}catch(e){return false}
}
function show(){
let id=location.hash.slice(1);
const ok=id==='ref'||(id.startsWith('d')&&W[id.slice(1)]);
if(!ok)id='d'+defId();
$('#v').innerHTML=id==='ref'?ref():day(id.slice(1));
document.querySelectorAll('nav button').forEach(b=>b.setAttribute('aria-current',String(b.dataset.i===id)));
if(id!=='ref')upd(id.slice(1));
const c=document.querySelector('nav [aria-current=true]');if(c)c.scrollIntoView({inline:'center',block:'nearest'});
window.scrollTo(0,0);
}
document.addEventListener('click',e=>{
const b=e.target.closest('nav button');
if(b){const i=b.dataset.i;if(location.hash.slice(1)===i)show();else location.hash=i;return}
if(e.target.id==='rst'){S={};save();show()}
if(e.target.id==='key'){const k=prompt('Clave del agente (PLAN_KEY)');if(k){try{localStorage.setItem('hxk',k.trim())}catch(x){}location.reload()}}
});
document.addEventListener('change',e=>{
const k=e.target.dataset&&e.target.dataset.k;
if(!k)return;
S[k]=e.target.checked;save();
const m=k.match(/^(f\d{8})/);
if(m&&W[m[1]])upd(m[1]);
});
window.addEventListener('hashchange',show);
show();
loadPlan().then(ok=>{if(ok){buildNav();location.hash.slice(1)&&W[location.hash.slice(2)]?0:history.replaceState(null,'','#d'+defId());show()}});
</script>
<script>if('serviceWorker' in navigator){window.addEventListener('load',function(){navigator.serviceWorker.register('sw.js').catch(function(){})})}</script>
